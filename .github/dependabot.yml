version: 2
updates:
  # Maintain dependencies for Cargo
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 10
    reviewers:
      - "fanilab-team"
    labels:
      - "refactor"
      - "enhancement"
    commit-message:
      prefix: "chore"
      include: "scope"
  
  # Maintain dependencies for GitHub Actions.
  # Every `uses:` entry in .github/workflows/ is pinned to a full commit SHA
  # (see the "Pinning GitHub Actions" section in CONTRIBUTING.md).
  # Dependabot understands SHA pins with a trailing `# vX.Y.Z` comment and will
  # open PRs that bump both the SHA and the comment, so pins do not go stale.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    labels:
      - "refactor"
      - "test"
    commit-message:
      prefix: "ci"

  # Maintain dependencies for the TypeScript SDK.
  - package-ecosystem: "npm"
    directory: "/sdk/typescript"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    labels:
      - "refactor"
      - "enhancement"
    commit-message:
      prefix: "chore"
      include: "scope"
