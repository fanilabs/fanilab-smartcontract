name: Rust CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always

# All jobs only read the repository; the Codecov upload uses tokenless
# same-repo upload and needs no extra scope (#244).
permissions:
  contents: read

jobs:
  build_and_test:
    name: Build and Test Contracts
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v7

    - name: Set up Rust toolchain
      uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
      with:
        targets: wasm32v1-none
        components: rustfmt, clippy

    - name: Cache dependencies
      uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

    - name: Check formatting
      run: cargo fmt --all -- --check

    - name: Run Clippy (Linter)
      run: cargo clippy --locked --all-targets --all-features --target wasm32v1-none -- -D warnings && cargo clippy --locked --workspace --all-targets -- -D warnings

    - name: Build Contracts (WASM)
      run: cargo build --locked --target wasm32v1-none --release

    - name: Enforce WASM size budgets
      run: |
        while read name limit; do
          file="target/wasm32v1-none/release/$name.wasm"
          size=$(wc -c < "$file"); echo "$name: $size / $limit bytes"
          test "$size" -le "$limit" || exit 1
        done < .github/wasm-size-budgets.txt

    - name: Run Tests
      run: cargo test --locked --verbose

    - name: Run Tests with Coverage
      run: |
        cargo install cargo-tarpaulin
        cargo tarpaulin --out Xml --output-dir ./coverage

    - name: Upload Coverage to Codecov
      uses: codecov/codecov-action@v7
      with:
        files: ./coverage/cobertura.xml
        fail_ci_if_error: true

    - name: Security Audit
      run: |
        cargo install cargo-audit
        cargo audit

    - name: Check for Unused Dependencies
      run: |
        cargo install cargo-machete
        cargo machete

    - name: Check for Outdated Dependencies
      run: |
        cargo install cargo-outdated
        cargo outdated --exit-code 1

  wasm_target_drift_check:
    name: Prevent wasm32-unknown-unknown Target Drift
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v7

    - name: Check deployment scripts use wasm32v1-none
      run: |
        echo "Scanning scripts/, Makefile, Makefile.windows, and .vscode/ for legacy wasm32-unknown-unknown target references..."
        if grep -rn "wasm32-unknown-unknown" scripts/ Makefile Makefile.windows .vscode/; then
          echo ""
          echo "❌ ERROR: One or more deployment scripts still reference the old"
          echo "   'wasm32-unknown-unknown' target. Soroban SDK 27+ requires"
          echo "   'wasm32v1-none'. Update all occurrences shown above."
          exit 1
        fi
        echo "✅ No legacy wasm target references found in scripts/, Makefile, Makefile.windows, or .vscode/."

  typescript_sdk:
    name: Build TypeScript SDK
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v7

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: sdk/typescript/package-lock.json

    - name: Install dependencies
      working-directory: sdk/typescript
      run: npm ci

    - name: Type check SDK
      working-directory: sdk/typescript
      run: npx tsc --noEmit

    - name: Build SDK
      working-directory: sdk/typescript
      run: npm run build

    - name: Type check examples
      working-directory: sdk/typescript
      run: npx tsc --noEmit examples/basic-usage.ts
