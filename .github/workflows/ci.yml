name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  shellcheck:
    name: ShellCheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install ShellCheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck

      - name: Run ShellCheck on deployment scripts
        run: |
          # Fail the job on any ShellCheck finding (severity=style and above).
          # Intentional suppressions live inline in the scripts as
          # `# shellcheck disable=SCxxxx` directives with a rationale comment,
          # rather than being blanket-disabled here.
          shellcheck --severity=style \
            scripts/deploy-all-contracts.sh \
            scripts/deploy-contract.sh \
            scripts/initialize-all-contracts.sh

  rust:
    name: Rust
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v7

    - name: Check deployment scripts use wasm32v1-none
      run: |
        echo "Scanning scripts/, Makefile, Makefile.windows, and .vscode/ for legacy wasm32-unknown-unknown target references..."
        if grep -rn "wasm32-unknown-unknown" scripts/ Makefile Makefile.windows .vscode/; then
          echo ""
          echo "❌ ERROR: One or more deployment scripts still reference the old"
          echo "   'wasm32-unknown-unknown' target. Soroban SDK 27+ requires"
          echo "   'wasm32v1-none'. Update all occurrences shown above."
          exit 1
        fi
        echo "✅ No legacy wasm target references found in scripts/, Makefile, Makefile.windows, or .vscode/."

  workflow_lint:
    name: Workflow Lint (actionlint)
    runs-on: ubuntu-latest
    env:
      # Pinned actionlint release. Bump deliberately; the checksum below must
      # be updated in lockstep with the version.
      ACTIONLINT_VERSION: '1.7.7'
      ACTIONLINT_SHA256: '023070a287cd8cccd71515fedc843f1985bf96c436b7effa23f6b9e2a7a8f0a1'
    steps:
    - name: Checkout repository
      uses: actions/checkout@v7

    - name: Install actionlint (pinned, checksum-verified)
      run: |
        set -euo pipefail
        archive="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
        url="https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/${archive}"
        curl --fail --silent --show-error --location --output "${archive}" "${url}"
        echo "${ACTIONLINT_SHA256}  ${archive}" | sha256sum --check --strict
        tar --extract --gzip --file "${archive}" actionlint
        install -m 0755 actionlint /usr/local/bin/actionlint
        actionlint --version

    - name: Run actionlint on all workflows
      run: |
        # Lints every workflow file, including expression syntax, `github.event.*`
        # input references, job/step keys, and embedded shell (via shellcheck).
        #
        # Suppressions policy: suppressions must be narrowly scoped and justified.
        #   * Prefer an inline `# actionlint-disable <rule> -- <rationale>` comment
        #     on the offending line or the line immediately above it.
        #   * Repo-wide or file-wide exceptions belong in `.github/actionlint.yaml`
        #     with a per-rule justification comment; do not disable rules globally.
        #
        # This job fails on, for example:
        #   * an invalid input reference such as
        #       ${{ github.event.inputs.does_not_exist }}
        #     (actionlint reports an undefined property on the inputs object), or
        #   * an unsupported step key such as `uses` combined with `run`, or a
        #     misspelled key like `withs:` (actionlint reports an unexpected key).
        actionlint -color

  typescript_sdk:
    name: Build TypeScript SDK (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Node 20 is the supported minimum runtime declared in
        # sdk/typescript/package.json engines.node; Node 22 is the current LTS.
        node-version: ['20', '22']

    steps:
    - name: Checkout repository
      uses: actions/checkout@v7

    - name: Set up Node.js
      uses: actions/setup-node@v7
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'
        cache-dependency-path: sdk/typescript/package-lock.json

    - name: Install dependencies
      working-directory: sdk/typescript
      run: npm ci

    - name: Test SDK
      working-directory: sdk/typescript
      run: npm test

    - name: Test SDK with coverage
      if: matrix.node-version == '22'
      working-directory: sdk/typescript
      run: npm run test:coverage

    - name: Upload SDK coverage to Codecov
      if: matrix.node-version == '22'
      uses: codecov/codecov-action@v4
      with:
        # Distinct flag keeps SDK coverage separate from the Rust report.
        files: sdk/typescript/coverage/lcov.info
        flags: typescript-sdk
        name: typescript-sdk-node22
        fail_ci_if_error: false

    - name: Type check SDK
      working-directory: sdk/typescript
      run: npx tsc --noEmit

    - name: Build SDK
      working-directory: sdk/typescript
      run: npm run build

    - name: Type check examples
      working-directory: sdk/typescript
      run: npx tsc --noEmit examples/basic-usage.ts
