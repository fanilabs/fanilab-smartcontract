name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  shellcheck:
    name: ShellCheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install ShellCheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck

      - name: Run ShellCheck on deployment scripts
        run: |
          # Fail the job on any ShellCheck finding (severity=style and above).
          # Intentional suppressions live inline in the scripts as
          # `# shellcheck disable=SCxxxx` directives with a rationale comment,
          # rather than being blanket-disabled here.
          shellcheck --severity=style \
            scripts/deploy-all-contracts.sh \
            scripts/deploy-contract.sh \
            scripts/initialize-all-contracts.sh

  rust_docs:
    name: Rust Docs
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v7

    - name: Build documentation (deny warnings)
      # Policy:
      # - `--workspace --lib` documents every workspace library target.
      # - `--no-deps` excludes dependency documentation, so third-party crates
      #   are not built; cross-crate links between workspace crates still
      #   resolve because those crates are documented in the same invocation.
      # - `RUSTDOCFLAGS='-D warnings'` turns broken intra-doc links and any
      #   other rustdoc warning into a hard failure.
      env:
        RUSTDOCFLAGS: -D warnings
      run: cargo doc --workspace --no-deps --lib

  rust:
    name: Rust
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v7

    - name: Check deployment scripts use wasm32v1-none
      run: |
        echo "Scanning scripts/, Makefile, Makefile.windows, and .vscode/ for legacy wasm32-unknown-unknown target references..."
        if grep -rn "wasm32-unknown-unknown" scripts/ Makefile Makefile.windows .vscode/; then
          echo ""
          echo "❌ ERROR: One or more deployment scripts still reference the old"
          echo "   'wasm32-unknown-unknown' target. Soroban SDK 27+ requires"
          echo "   'wasm32v1-none'. Update all occurrences shown above."
          exit 1
        fi
        echo "✅ No legacy wasm target references found in scripts/, Makefile, Makefile.windows, or .vscode/."

  typescript_sdk:
    name: Build TypeScript SDK (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Node 20 is the supported minimum runtime declared in
        # sdk/typescript/package.json engines.node; Node 22 is the current LTS.
        node-version: ['20', '22']

    steps:
    - name: Checkout repository
      uses: actions/checkout@v7

    - name: Set up Node.js
      uses: actions/setup-node@v7
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'
        cache-dependency-path: sdk/typescript/package-lock.json

    - name: Install dependencies
      working-directory: sdk/typescript
      run: npm ci

    - name: Test SDK
      working-directory: sdk/typescript
      run: npm test

    - name: Type check SDK
      working-directory: sdk/typescript
      run: npx tsc --noEmit

    - name: Build SDK
      working-directory: sdk/typescript
      run: npm run build

    - name: Type check examples
      working-directory: sdk/typescript
      run: npx tsc --noEmit examples/basic-usage.ts
