name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  shellcheck:
    name: ShellCheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install ShellCheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck

      - name: Run ShellCheck on deployment scripts
        run: |
          # Fail the job on any ShellCheck finding (severity=style and above).
          # Intentional suppressions live inline in the scripts as
          # `# shellcheck disable=SCxxxx` directives with a rationale comment,
          # rather than being blanket-disabled here.
          shellcheck --severity=style \
            scripts/deploy-all-contracts.sh \
            scripts/deploy-contract.sh \
            scripts/initialize-all-contracts.sh

  msrv:
    name: MSRV (1.84.0)
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v7

    - name: Install pinned MSRV toolchain
      uses: dtolnay/rust-toolchain@b3b07ba8b418998c39fb20f9d8b27520de0a4799 # stable
      with:
        toolchain: 1.84.0
        targets: wasm32v1-none

    - name: Cache cargo registry and build artifacts
      uses: actions/cache@v4
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target
        key: ${{ runner.os }}-msrv-1.84.0-${{ hashFiles('**/Cargo.lock') }}
        restore-keys: |
          ${{ runner.os }}-msrv-1.84.0-

    - name: Build workspace for wasm32v1-none (locked)
      run: cargo build --locked --target wasm32v1-none

    - name: Run tests (locked)
      run: cargo test --locked

  rust:
    name: Rust
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v7

    - name: Validate Cargo publish policy
      run: |
        # Contract crates and shared_types are internal-only and must declare
        # `publish = false`. Fail if any workspace crate is publishable.
        if cargo metadata --no-deps --format-version 1 \
          | jq -e '.packages[] | select(.publish != [])' > /dev/null; then
          echo "❌ ERROR: One or more workspace crates are publishable."
          echo "   Contract crates are internal-only; set 'publish = false'."
          cargo metadata --no-deps --format-version 1 \
            | jq -r '.packages[] | select(.publish != []) | "  - \(.name) (\(.manifest_path))"'
          exit 1
        fi
        echo "✅ All workspace crates declare publish = false."

    - name: Check deployment scripts use wasm32v1-none
      run: |
        echo "Scanning scripts/, Makefile, Makefile.windows, and .vscode/ for legacy wasm32-unknown-unknown target references..."
        if grep -rn "wasm32-unknown-unknown" scripts/ Makefile Makefile.windows .vscode/; then
          echo ""
          echo "❌ ERROR: One or more deployment scripts still reference the old"
          echo "   'wasm32-unknown-unknown' target. Soroban SDK 27+ requires"
          echo "   'wasm32v1-none'. Update all occurrences shown above."
          exit 1
        fi
        echo "✅ No legacy wasm target references found in scripts/, Makefile, Makefile.windows, or .vscode/."

  typescript_sdk:
    name: Build TypeScript SDK (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Node 20 is the supported minimum runtime declared in
        # sdk/typescript/package.json engines.node; Node 22 is the current LTS.
        node-version: ['20', '22']

    steps:
    - name: Checkout repository
      uses: actions/checkout@v7

    - name: Set up Node.js
      uses: actions/setup-node@v7
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'
        cache-dependency-path: sdk/typescript/package-lock.json

    - name: Install dependencies
      working-directory: sdk/typescript
      run: npm ci

    - name: Test SDK
      working-directory: sdk/typescript
      run: npm test

    - name: Type check SDK
      working-directory: sdk/typescript
      run: npx tsc --noEmit

    - name: Build SDK
      working-directory: sdk/typescript
      run: npm run build

    - name: Type check examples
      working-directory: sdk/typescript
      run: npx tsc --noEmit examples/basic-usage.ts
