name: Deploy to Testnet

on:
  workflow_dispatch:
    inputs:
      contract:
        description: 'Contract to deploy'
        required: true
        type: choice
        options:
          - all
          - escrow_contract
          - delivery_contract
          - dispute_resolution_contract
          - fleet_management_contract
          - identity_reputation_contract
          - settlement_contract

env:
  CARGO_TERM_COLOR: always
  STELLAR_NETWORK: testnet

# Checkout and artifact upload are all this workflow needs; deployment
# authority comes from CONTRACT_DEPLOYER_SECRET, not the GITHUB_TOKEN (#244).
permissions:
  contents: read

jobs:
  deploy:
    name: Deploy Contract to Testnet
    runs-on: ubuntu-latest
    environment: testnet
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v7

    - name: Set up Rust toolchain
      uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
      with:
        targets: wasm32v1-none

    - name: Cache dependencies
      uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

    - name: Install Stellar CLI
      run: |
        cargo install --locked stellar-cli --features opt

    - name: Build Contracts
      run: cargo build --locked --target wasm32v1-none --release

    - name: Optimize WASM
      run: |
        mkdir -p release_artifacts
        for contract in target/wasm32v1-none/release/*.wasm; do
          filename=$(basename "$contract")
          cp "$contract" "release_artifacts/$filename"
        done

    - name: Configure deployer identity
      env:
        CONTRACT_DEPLOYER_SECRET: ${{ secrets.TESTNET_DEPLOYER_SECRET }}
      run: |
        if [ -z "$CONTRACT_DEPLOYER_SECRET" ]; then
          echo "::warning::CONTRACT_DEPLOYER_SECRET is empty. Set the TESTNET_DEPLOYER_SECRET"
          echo "::warning::secret on the 'testnet' environment. The deploy step will now stop"
          echo "::warning::with actionable guidance from the deployment scripts."
          exit 0
        fi
        # Create the Stellar CLI identity named 'deployer' that every
        # deploy/initialize script signs with (--source deployer). The key is
        # fed through stdin (stellar keys add reads it from a non-TTY stdin),
        # never via argv or the workflow file, so it never reaches the logs.
        printf '%s\n' "$CONTRACT_DEPLOYER_SECRET" | stellar keys add deployer --secret-key --overwrite
        echo "Configured Stellar CLI identity 'deployer' -> $(stellar keys address deployer)"

    - name: Deploy Contract
      run: |
        if [ "${{ github.event.inputs.contract }}" = "all" ]; then
          bash scripts/deploy-all-contracts.sh
        else
          bash scripts/deploy-contract.sh ${{ github.event.inputs.contract }}
        fi

    - name: Save Deployment Artifacts
      uses: actions/upload-artifact@v7
      with:
        name: deployment-info
        path: contract-ids-*.json
        if-no-files-found: error

