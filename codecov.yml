codecov:
  require_ci_to_pass: yes
  notify:
    wait_for_ci: yes

coverage:
  precision: 2
  round: down
  range: "70...100"
  status:
    project:
      default:
        target: 80%
        threshold: 5%
    patch:
      default:
        target: 80%

flags:
  rust:
    paths:
      - "src/"
      - "crates/"
    carryforward: true
  typescript-sdk:
    paths:
      - "sdk/typescript/"
    carryforward: true

comment:
  layout: "reach,diff,flags,tree"
  behavior: default
  require_changes: no

ignore:
  - "tests/"
  - "**/*test.rs"
  - "**/test.rs"
  - "sdk/typescript/coverage/"
  - "sdk/typescript/dist/"
  - "sdk/typescript/node_modules/"