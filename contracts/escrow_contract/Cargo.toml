[package]
name = "escrow_contract"
version = "0.2.0"
edition = "2021"
license = "MIT"

[lib]
path = "lib.rs"
crate-type = ["cdylib", "rlib"]

[dependencies]
soroban-sdk = { workspace = true }
shared_types = { path = "../shared_types" }

[dev-dependencies]
soroban-sdk = { workspace = true, features = ["testutils"] }
proptest = "1"
# Integration-test only: the Holdback refund invariant spans the real
# delivery -> escrow -> identity_reputation chain, so its regression test wires
# the actual contracts together instead of mocks. Mirrors the dev-dependency
# pattern already used by dispute_resolution_contract.
delivery_contract = { path = "../delivery_contract" }
dispute_resolution_contract = { path = "../dispute_resolution_contract" }
identity_reputation_contract = { path = "../identity_reputation_contract" }
